[project]
name = "folio"
version = "0.1.0"
description = "Folio document parsing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pillow>=10",
    "pypdfium2>=4",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
vllm = [
    "vllm==0.30.0; sys_platform == 'linux'",
    "transformers==5.16.1; sys_platform == 'linux'"
]

[dependency-groups]
dev = ["ruff>=0.14,<1", "pytest>=8,<10"]

[project.scripts]
folio = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = [".tmp/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
